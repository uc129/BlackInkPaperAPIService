name: Build and deploy BlackInkPaper

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build API
        run: dotnet build BlackInkPaperAPIService/BlackInkPaperAPIService.csproj --configuration Release

      - name: Build Admin
        run: dotnet build BlackInkPaperAdmin/BlackInkPaperAdmin.csproj --configuration Release

      # Regenerates docs/api/swagger-v1.json from the freshly built app and fails if the
      # committed copy differs. Without this the spec silently rots the moment someone adds
      # an endpoint, which is exactly how the storefront's copy fell five endpoints behind.
      - name: Check committed OpenAPI spec is current
        env:
          # The exporter builds the host, which requires a connection string, but never opens
          # a connection. A placeholder keeps this step working regardless of whether real
          # credentials live in appsettings.json or in Azure App Settings.
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=ci;Username=ci;Password=ci"
        run: |
          # --no-launch-profile: `dotnet run --project` otherwise applies launchSettings.json,
          # which pins ASPNETCORE_ENVIRONMENT and applicationUrl. The document is identical
          # either way, but CI should not depend on a developer-local file.
          dotnet run --project BlackInkPaperAPIService/BlackInkPaperAPIService.csproj \
            --configuration Release --no-build --no-launch-profile -- --dump-openapi

          # --porcelain rather than `git diff --exit-code`: that reports clean for an
          # untracked file, so a spec that was never committed would pass silently.
          if [ -n "$(git status --porcelain -- docs/api/swagger-v1.json)" ]; then
            echo "::error::docs/api/swagger-v1.json is out of date or uncommitted."
            git diff -- docs/api/swagger-v1.json | head -50
            echo "Run: cd BlackInkPaperAPIService && dotnet run -- --dump-openapi ; then commit."
            exit 1
          fi
          echo "OpenAPI spec is current."


      - name: Publish API
        run: dotnet publish BlackInkPaperAPIService/BlackInkPaperAPIService.csproj -c Release -o ./publish/api

      - name: Publish Admin
        run: dotnet publish BlackInkPaperAdmin/BlackInkPaperAdmin.csproj -c Release -o ./publish/admin

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-app
          path: ./publish/api

      - name: Upload Admin artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-app
          path: ./publish/admin

  deploy-api:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: api-app
          path: ./api-app

      - name: Deploy API to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BlackInkPaperAPIService'
          slot-name: 'Production'
          package: ./api-app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2381AE175AE8441B820876C1CC270970 }}

  deploy-admin:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Admin artifact
        uses: actions/download-artifact@v4
        with:
          name: admin-app
          path: ./admin-app

      - name: Deploy Admin to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'BlackInkPaper-Admin'
          slot-name: 'Production'
          package: ./admin-app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_ADMIN }}
